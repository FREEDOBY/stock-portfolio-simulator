# Render Blueprint — FastAPI 백엔드 (무료 플랜)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stock-portfolio-simulator-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # numpy/pandas/pykrx 휠 호환성을 위해 3.12 고정
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Vercel 프론트엔드 프로덕션 도메인 (배포 후 대시보드에서 실제 값 입력)
      # 예: https://stock-portfolio-simulator-six.vercel.app
      - key: FRONTEND_URL
        sync: false
      # FRED API 키 — 없으면 경제(FRED) 데이터가 "데이터 부족"으로 나옴
      # 로컬 .env의 FRED_API_KEY 값을 대시보드에서 입력 (git에 올리지 말 것)
      - key: FRED_API_KEY
        sync: false
      # 공공데이터포털(data.go.kr) 인증키 — KOFIA(신용잔고·반대매매) + 관세청(한국 반도체 수출) 공용
      # 없으면 코스피 저점의 신용/반대매매·반도체 수출이 수동/미표시로 폴백 (나머지는 정상)
      - key: KOFIA_API_KEY
        sync: false
